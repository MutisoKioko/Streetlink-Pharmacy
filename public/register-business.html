<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Create Your Business Account — Streetlink Pharmacy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <h1>Create Your Pharmacy Account</h1>
    </div>

    <div class="card">
      <p style="margin-top:0;color:#666;font-size:14px;">
        Set up your business — you'll be the first admin, and can add staff afterward from the admin panel.
      </p>
      <div id="errorBox" class="error" style="display:none;"></div>
      <div id="successBox" style="display:none; color:#0d6e6e; margin-bottom:12px;"></div>

      <form id="registerBusinessForm">
        <input type="text" id="business-name" placeholder="Business name" required>
        <input type="text" id="admin-name" placeholder="Your full name" required>
        <input type="email" id="admin-email" placeholder="Your email" required>
        <input type="tel" id="admin-phone" placeholder="Your phone number" required>
        <input type="password" id="admin-password" placeholder="Password (min 6 chars)" required>
        <input type="password" id="admin-confirm-password" placeholder="Confirm password" required>
        <button type="submit">Create Account</button>
      </form>

      <p style="font-size:14px;margin-top:16px;">
        Already have an account? <a href="/index.html">Log in</a>
      </p>
    </div>
  </div>

  <script src="/js/register-business.js"></script>
</body>
</html>
