<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Business - Multi-Tenant Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="top-bar">
        <h1>Register Business</h1>
    </div>

    <div class="container">
        <div class="card">
            <h2>Create Your Account</h2>
            
            <div id="error-box" class="error" style="display: none;"></div>
            <div id="success-box" class="success" style="display: none;"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="business-name">Business Name</label>
                    <input 
                        type="text" 
                        id="business-name" 
                        name="business-name" 
                        required
                        placeholder="Your business name"
                    >
                </div>

                <div class="form-group">
                    <label for="admin-name">Admin Name</label>
                    <input 
                        type="text" 
                        id="admin-name" 
                        name="admin-name" 
                        required
                        placeholder="Your full name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        placeholder="your@email.com"
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        required
                        placeholder="+254 XXX XXX XXX"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        placeholder="At least 8 characters"
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirm-password" 
                        name="confirm-password" 
                        required
                        placeholder="Re-enter your password"
                    >
                </div>

                <button type="submit" class="btn">Create Account</button>
            </form>

            <p class="secondary">
                Already have an account? <a href="index.html">Sign in here</a>
            </p>
        </div>
    </div>

    <script src="js/register-business.js"></script>
</body>
</html>
