<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Streetlink Pharmacy</title>
</head>
<body>
  <h1>Streetlink Pharmacy</h1>
  <form id="product-form">
  <input type="text" id="name" placeholder="Product name" required>
  <input type="number" id="price" placeholder="Price" step="0.01" required>
  <input type="number" id="quantity" placeholder="Quantity" required>
  <input type="text" id="category" placeholder="Category">
  <input type="text" id="supplier" placeholder="Supplier">
  <input type="date" id="expiry_date">
  <button type="submit">Add Product</button>
</form>

<table id="product-table" border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Quantity</th>
      <th>Category</th>
      <th>Supplier</th>
      <th>Expiry Date</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="product-table-body">
  </tbody>
</table>
<script>
  async function loadProducts() {
    const response = await fetch('/products');
    const products = await response.json();

    const tbody = document.getElementById('product-table-body');
    tbody.innerHTML = '';

    products.forEach(product => {
      const row = document.createElement('tr');
      row.id = `row-${product.id}`;
      row.innerHTML = `
        <td>${product.id}</td>
        <td>${product.name}</td>
        <td>${product.price}</td>
        <td>${product.quantity}</td>
        <td>${product.category || ''}</td>
        <td>${product.supplier || ''}</td>
        <td>${product.expiry_date || ''}</td>
        <td>
          <button onclick="editProduct(${product.id})">Edit</button>
          <button onclick="deleteProduct(${product.id})">Delete</button>
        </td>
    `;
      tbody.appendChild(row);
    });
  }

  async function deleteProduct(id) {
   await fetch(`/products/${id}`, {
    method: 'DELETE'
  });
  loadProducts();
}

function editProduct(id) {
  const row = document.getElementById(`row-${id}`);
  const cells = row.querySelectorAll('td');

  const name = cells[1].textContent;
  const price = cells[2].textContent;
  const quantity = cells[3].textContent;
  const category = cells[4].textContent;
  const supplier = cells[5].textContent;
  const expiry_date = cells[6].textContent;

  cells[1].innerHTML = `<input type="text" id="edit-name-${id}" value="${name}">`;
  cells[2].innerHTML = `<input type="number" step="0.01" id="edit-price-${id}" value="${price}">`;
  cells[3].innerHTML = `<input type="number" id="edit-quantity-${id}" value="${quantity}">`;
  cells[4].innerHTML = `<input type="text" id="edit-category-${id}" value="${category}">`;
  cells[5].innerHTML = `<input type="text" id="edit-supplier-${id}" value="${supplier}">`;
  cells[6].innerHTML = `<input type="date" id="edit-expiry-${id}" value="${expiry_date}">`;

  cells[7].innerHTML = `<button onclick="saveProduct(${id})">Save</button>`;
}

async function saveProduct(id) {
  const name = document.getElementById(`edit-name-${id}`).value;
  const price = parseFloat(document.getElementById(`edit-price-${id}`).value);
  const quantity = parseInt(document.getElementById(`edit-quantity-${id}`).value);
  const category = document.getElementById(`edit-category-${id}`).value;
  const supplier = document.getElementById(`edit-supplier-${id}`).value;
  const expiry_date = document.getElementById(`edit-expiry-${id}`).value;

  const response = await fetch(`/products/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, price, quantity, category, supplier, expiry_date })
  });

  if (!response.ok) {
    const data = await response.json();
    alert(data.error);
    return;
  }

  loadProducts();
}

  document.getElementById('product-form').addEventListener('submit', async (event) => {
  event.preventDefault();

  const name = document.getElementById('name').value;
  const price = parseFloat(document.getElementById('price').value);
  const quantity = parseInt(document.getElementById('quantity').value);
  const category = document.getElementById('category').value;
  const supplier = document.getElementById('supplier').value;
  const expiry_date = document.getElementById('expiry_date').value;

const response = await fetch('/products', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ name, price, quantity, category, supplier, expiry_date })
});

if (!response.ok) {
  const data = await response.json();
  alert(data.error);
  return;
}

document.getElementById('product-form').reset();
loadProducts();
});

  loadProducts();
</script>
</body>
</html>
